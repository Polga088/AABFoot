{% extends "base.html" %}
{% block content %}
<section class="auth-page">
  <article class="card auth-card">
    <div class="auth-brand">
      <img src="{{ url_for('static', filename='img/aab-logo.png') }}" alt="Foot AAB" class="auth-logo">
      <h1 class="auth-title">Créer ton code PIN</h1>
      <p class="auth-sub">Bienvenue <strong>{{ player_name }}</strong> — choisis un code à 4–6 chiffres pour sécuriser ton compte.</p>
    </div>

    {% if error %}
    <p class="form-feedback is-error">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('auth.setup_pin_submit') }}" class="event-form auth-form">
      {% if next_url %}
      <input type="hidden" name="next" value="{{ next_url }}">
      {% endif %}
      <div class="form-row">
        <label for="pin" class="form-label">Nouveau code PIN</label>
        <input
          id="pin"
          name="pin"
          type="password"
          class="form-input"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="6"
          placeholder="Ex. 1234"
          autocomplete="new-password"
          required
          autofocus
        >
      </div>
      <div class="form-row">
        <label for="pin_confirm" class="form-label">Confirmer le code</label>
        <input
          id="pin_confirm"
          name="pin_confirm"
          type="password"
          class="form-input"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="6"
          placeholder="Retape le même code"
          autocomplete="new-password"
          required
        >
      </div>
      <button type="submit" class="btn btn-primary auth-submit">Enregistrer et accéder au wallet</button>
    </form>

    <p class="auth-footer-note">
      <a href="{{ url_for('auth.login_page') }}">← Retour à la connexion</a>
    </p>
  </article>
</section>
{% endblock %}
